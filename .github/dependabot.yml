# Dependabot keeps pinned GitHub Actions and locked Python dependencies up to
# date. Combined with SHA-pinned actions in the workflow and digest-pinned base
# images in deploy/Dockerfile, updates are explicit, reviewed PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch
