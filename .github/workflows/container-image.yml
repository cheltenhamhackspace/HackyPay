name: container-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege by default; only the build job (`packages: write`) and the
# release bump job (`contents: write`, tag-triggered) opt into more.
permissions:
  contents: read

jobs:
  # Supply-chain gate: audit the locked runtime dependencies against the
  # PyPI advisory database. Runs alongside build (non-blocking for deploys);
  # fails the PR/check on any known vulnerability.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Export runtime dependencies from lockfile
        working-directory: backend
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt

      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: backend/requirements.txt

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # arm64 is emulated via QEMU (fine for this image size; if builds feel
      # slow, switch to native arm runners + manifest-merge strategy)
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            # :latest tracks the newest release tag (not main), so the
            # Compose published-image path has a stable no-config default.
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # PRs: amd64-only sanity build (no push). main/tags: full multi-arch push.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply-chain attestations published alongside the image:
          # SLSA provenance (how/where it was built) and an in-toto SBOM.
          # View with: docker buildx imagetools inspect <image>
          provenance: mode=min
          sbom: true

  # Release automation: after a vX.Y.Z tag's image is built and pushed, bump
  # the pinned image tag in the k8s manifest and commit it to main, so the
  # checked-in deployment always references the released version.
  # [skip ci] prevents the manifest commit from triggering a rebuild loop.
  bump-manifest:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Only job in the workflow with push credentials; scoped to
          # contents:write and tag events only.
          persist-credentials: true

      - name: Update image tag in deploy manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # GHCR paths are lowercase; the repo name may not be.
          REPO_LC="${GITHUB_REPOSITORY,,}"
          FILE=deploy/k8s/deployment.yaml
          grep -q "image: ghcr.io/${REPO_LC}:" "$FILE" || {
            echo "::error::image line not found in $FILE"; exit 1
          }
          sed -i "s|image: ghcr.io/${REPO_LC}:.*|image: ghcr.io/${REPO_LC}:${VERSION}|" "$FILE"
          git diff --stat

      - name: Commit and push
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/deployment.yaml
          git commit -m "deploy: bump image to ${VERSION} (${GITHUB_REF_NAME}) [skip ci]"
          git push origin main
