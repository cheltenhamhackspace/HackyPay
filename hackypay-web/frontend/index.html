<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackyPay™ Self Checkout</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="app-title">HackyPay™ Self Checkout</h1>
                <div class="system-status" id="systemStatus">
                    <span class="status-indicator"></span>
                    <span class="status-text">System Ready</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Panel - Shopping Cart -->
            <section class="cart-panel">
                <div class="panel-header">
                    <h2>🛒 Shopping Cart</h2>
                    <button class="clear-cart-btn" id="clearCartBtn" disabled>
                        🗑️ Clear Cart
                    </button>
                </div>
                
                <div class="cart-items" id="cartItems">
                    <div class="empty-cart-message">
                        <p>Your cart is empty</p>
                        <p class="empty-cart-subtitle">Add items to get started</p>
                    </div>
                </div>
                
                <div class="cart-summary">
                    <div class="total-display">
                        <span class="total-label">Total:</span>
                        <span class="total-amount" id="totalAmount">£0.00</span>
                    </div>
                </div>
            </section>

            <!-- Center Panel - Item Selection -->
            <section class="items-panel">
                <div class="panel-header">
                    <h2>📦 Select Item Type</h2>
                </div>
                
                <div class="item-types-grid" id="itemTypesGrid">
                    <!-- Item type buttons will be populated by JavaScript -->
                </div>
            </section>

            <!-- Right Panel - Checkout & Status -->
            <section class="checkout-panel">
                <div class="checkout-button-container">
                    <button class="checkout-btn" id="checkoutBtn" disabled>
                        💳 CHECKOUT
                    </button>
                </div>
                
                <div class="status-panel">
                    <h3>📋 Status</h3>
                    <div class="status-message" id="statusMessage">
                        👆 Select an item type to add to your cart
                    </div>
                </div>
                
                <div class="transaction-log">
                    <h3>📝 Transaction Log</h3>
                    <div class="log-content" id="logContent">
                        <div class="log-entry">System initialized</div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Item Input Modal -->
        <div class="modal-overlay" id="itemModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="modalItemType">Item Type</h2>
                    <button class="modal-close" id="modalClose">×</button>
                </div>
                
                <div class="modal-body">
                    <div class="price-input-section">
                        <label for="priceInput">💷 Enter Price</label>
                        <div class="price-display" id="priceDisplay">£0.00</div>
                    </div>
                    
                    <div class="keypad">
                        <button class="keypad-btn" data-digit="1">1</button>
                        <button class="keypad-btn" data-digit="2">2</button>
                        <button class="keypad-btn" data-digit="3">3</button>
                        <button class="keypad-btn" data-digit="4">4</button>
                        <button class="keypad-btn" data-digit="5">5</button>
                        <button class="keypad-btn" data-digit="6">6</button>
                        <button class="keypad-btn" data-digit="7">7</button>
                        <button class="keypad-btn" data-digit="8">8</button>
                        <button class="keypad-btn" data-digit="9">9</button>
                        <button class="keypad-btn clear-btn" data-action="clear">C</button>
                        <button class="keypad-btn" data-digit="0">0</button>
                        <button class="keypad-btn" data-digit=".">.</button>
                    </div>
                </div>
                
                <div class="modal-footer">
                    <button class="modal-btn cancel-btn" id="modalCancel">❌ Cancel</button>
                    <button class="modal-btn add-btn" id="modalAdd">✅ Add to Cart</button>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-content">
                <div class="loading-spinner"></div>
                <div class="loading-text" id="loadingText">Processing payment...</div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
