# Placeholder SumUp credentials — REPLACE before applying.
# Values must satisfy backend/app/config.py validators:
#   SUMUP_API_TOKEN      starts with "sup_sk_", length >= 20
#   SUMUP_MERCHANT_CODE  length >= 5
#   SUMUP_READER_ID      starts with "rdr_"
#
# Create the real secret out-of-band, e.g.:
#   kubectl -n hackypay create secret generic hackypay-sumup \
#     --from-literal=SUMUP_API_TOKEN='sup_sk_...' \
#     --from-literal=SUMUP_MERCHANT_CODE='...' \
#     --from-literal=SUMUP_READER_ID='rdr_...'
apiVersion: v1
kind: Secret
metadata:
  name: hackypay-sumup
  namespace: hackypay
  labels:
    app.kubernetes.io/name: hackypay
type: Opaque
stringData:
  SUMUP_API_TOKEN: "sup_sk_REPLACE_ME_REAL_TOKEN"
  SUMUP_MERCHANT_CODE: "REPLACE_ME"
  SUMUP_READER_ID: "rdr_REPLACE_ME"