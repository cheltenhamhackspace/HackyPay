apiVersion: apps/v1
kind: Deployment
metadata:
  name: hackypay
  namespace: hackypay
  labels:
    app.kubernetes.io/name: hackypay
    app.kubernetes.io/component: backend
spec:
  # ONE replica on purpose: the in-memory rate limiter and the single physical
  # card reader are singletons. Scaling out needs Redis-backed rate limiting
  # and per-reader routing first.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hackypay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hackypay
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        # Matches the distroless nonroot user (uid 65532, has /etc/passwd entry).
        runAsUser: 65532
        runAsGroup: 65532
        # Makes emptyDir volumes (e.g. /tmp) group-writable for 65532.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hackypay
          image: ghcr.io/cheltenhamhackspace/hackypay:1.3.0
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            # The app only reads its files at runtime; the one write path
            # (items config) is guarded and read-only-mounted in k8s anyway.
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: hackypay-sumup
            - configMapRef:
                name: hackypay-config
          volumeMounts:
            - name: items-config
              mountPath: /app/items_config.json
              subPath: items_config.json
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
      # ghcr packages are private by default: make the package public, or
      # create an imagePullSecret and uncomment:
      # imagePullSecrets:
      #   - name: ghcr-pull
      volumes:
        - name: items-config
          configMap:
            name: hackypay-config
        - name: tmp
          emptyDir: {}
      # Egress to api.sumup.com:443 is required for reader/checkout calls.
      # If you run a NetworkPolicy default-deny policy, add an allow rule for
      # TCP 443 to api.sumup.com from this pod.