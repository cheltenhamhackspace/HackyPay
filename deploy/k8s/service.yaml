apiVersion: v1
kind: Service
metadata:
  name: hackypay
  namespace: hackypay
  labels:
    app.kubernetes.io/name: hackypay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hackypay
  ports:
    - name: http
      port: 80
      targetPort: http
---
